<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lembrete — Bapell Gestor Pro</title>
    <!-- Janela de aviso de lembrete: abre sozinha no canto da tela quando um
         lembrete vence (ver "LEMBRETES" no main.js). Usa as cores do tema
         escolhido no app. -->
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/fonts.css" />
    <link rel="stylesheet" href="CSS/lembrete-aviso.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("precifiq_theme");
          var temas = ["light", "dark", "midnight"];
          document.documentElement.setAttribute(
            "data-theme",
            temas.indexOf(saved) >= 0 ? saved : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div class="av" id="aviso" role="alertdialog" aria-labelledby="avTitulo" aria-describedby="avQuando">
      <div class="av-faixa" aria-hidden="true"></div>

      <!-- Topo: dá para arrastar a janela por aqui -->
      <div class="av-topo">
        <span class="av-sino" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </span>
        <span class="av-rotulo">Lembrete</span>
        <span class="av-app">Bapell Gestor Pro</span>

        <div class="av-nav" id="avNav" hidden>
          <button type="button" class="av-nav__btn" id="avAnterior" title="Lembrete anterior" aria-label="Lembrete anterior">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="av-nav__txt" id="avContador">1 de 1</span>
          <button type="button" class="av-nav__btn" id="avProximo" title="Próximo lembrete" aria-label="Próximo lembrete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <button type="button" class="av-x" id="avDispensar" title="Dispensar este aviso" aria-label="Dispensar este aviso">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
        </button>
      </div>

      <div class="av-corpo">
        <div class="av-titulo" id="avTitulo">—</div>
        <div class="av-quando" id="avQuando">
          <span class="av-selo" id="avSelo">Vencido</span>
          <span id="avQuandoTxt"></span>
        </div>
        <div class="av-metas" id="avMetas"></div>
        <div class="av-obs" id="avObs" hidden></div>
      </div>

      <!-- Adiar: avisa de novo daqui a pouco, sem mudar o lembrete -->
      <div class="av-adiar">
        <span class="av-adiar__rot">Lembrar de novo em</span>
        <div class="av-adiar__opcoes" id="avAdiar">
          <button type="button" class="av-chip" data-min="5">5 min</button>
          <button type="button" class="av-chip" data-min="15">15 min</button>
          <button type="button" class="av-chip" data-min="30">30 min</button>
          <button type="button" class="av-chip" data-min="60">1 hora</button>
          <button type="button" class="av-chip" data-amanha="1" title="Amanhã às 9h">Amanhã</button>
        </div>
      </div>

      <div class="av-acoes">
        <button type="button" class="btn-secondary av-btn" id="avAbrir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          Abrir lembrete
        </button>
        <button type="button" class="btn-primary av-btn av-btn--concluir" id="avConcluir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
          Concluir
        </button>
      </div>
    </div>

    <script src="JS/lembrete-aviso.js"></script>
  </body>
</html>
